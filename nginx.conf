# Cache policy by URL. Set once with a map so every response also keeps the
# security headers below (add_header inside a location would drop them).
map $uri $om_cache_control {
    default                                                   "no-cache";
    ~*^/js/gsap/                                              "public, max-age=2592000, immutable";
    ~*\.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$   "public, max-age=2592000";
    ~*\.(?:css|js)$                                           "public, max-age=0, must-revalidate";
    ~*^/(?:robots\.txt|sitemap\.xml)$                         "public, max-age=3600";
    /site.webmanifest                                         "public, max-age=86400";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Coolify's proxy (Traefik) terminates HTTPS and handles the
    # www / non-www redirect, so this server only speaks plain HTTP.

    charset utf-8;
    server_tokens off;

    # ---- Compression -------------------------------------------------
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/xml
               application/javascript application/json
               application/manifest+json image/svg+xml;

    # ---- Headers on every response -----------------------------------
    add_header Cache-Control $om_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- MIME type nginx doesn't know --------------------------------
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # ---- Health check (used by the Dockerfile HEALTHCHECK) ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # ---- Pages: /terms and /terms.html both work ---------------------
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /index.html;
}
